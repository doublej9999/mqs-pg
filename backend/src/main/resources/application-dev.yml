spring:
  flyway:
    # dev 额外加载 demo 种子数据（V900__demo_seed.sql）
    locations: classpath:db/migration,classpath:db/demo

logging:
  level:
    com.mqspg: DEBUG

# 开发环境打开 Swagger UI（生产默认关闭，见 application.yml）。
# 入口：http://localhost:8080/swagger-ui/index.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
