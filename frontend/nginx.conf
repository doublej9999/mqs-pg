# nginx 托管前端 + 反代后端 API（L2）
#
# 为什么需要反代：前端 axios 的 baseURL 是相对路径 `/api`（见 api/request.js），
# 开发期由 Vite 的 proxy 转发。生产用 nginx 托管静态文件时，如果没有这段
# 反代，`/api/...` 会被当成静态路径 → 404。**不需要改前端代码**。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 统一声明 UTF-8。页面里有 <meta charset>，浏览器通常也能正常显示，
    # 但显式写在响应头里更可靠（尤其被别的工具/爬虫按头解析时）。
    # 实测不写时 Content-Type 是裸的 `text/html`，没有 charset。
    charset utf-8;

    # 单页应用：未知路径回落到 index.html，否则刷新 /routes 会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API。用 compose 里的服务名 backend，**不是 localhost** ——
    # 容器内的 localhost 指向 nginx 自己。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 重试（replay / 批量操作）可能耗时超过默认的 60s
        proxy_read_timeout 120s;
    }

    # 带 hash 的静态资源可以长缓存；index.html 不缓存，
    # 否则发版后用户会一直拿到旧的入口文件（进而引用已删除的 chunk）。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # gzip：JS/CSS 收益最大，且不涉及图片（图片自己已压缩）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
